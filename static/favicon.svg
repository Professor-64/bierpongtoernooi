<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="6" fill="#1e293b"/>
  <!-- Ping pong ball -->
  <circle cx="16" cy="9" r="6.5" fill="white"/>
  <!-- Ball seam line -->
  <path d="M10 8 Q16 11 22 8" stroke="#dde" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <!-- Cup rim -->
  <rect x="4" y="15" width="24" height="3" fill="#b91c1c" rx="1"/>
  <!-- Cup body -->
  <path d="M5.5 18 L26.5 18 L22.5 30 L9.5 30 Z" fill="#e63946"/>
  <!-- Cup highlight lines -->
  <line x1="8.5" y1="22" x2="23.5" y2="22" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="9.5" y1="26" x2="22.5" y2="26" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
</svg>
