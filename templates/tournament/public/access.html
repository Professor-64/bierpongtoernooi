{% load tournament_tags %}<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Toegang — {{ tournament.name }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <link rel="stylesheet" href="/static/css/public.css?v={{ tournament.id }}">
  <style>
    :root {
      --bp-primary: {{ tournament.primary_color }};
      --bp-primary-rgb: {{ tournament.primary_color|hex_to_rgb }};
      --tblr-primary: {{ tournament.primary_color }};
    }
  </style>
</head>
<body>
  <div class="public-header">
    <div class="d-flex align-items-center gap-3">
      {% if tournament.logo %}
        <img src="{{ tournament.logo.url }}" style="height:36px" alt="">
      {% endif %}
      <span class="tournament-title">{{ tournament.name }}</span>
    </div>
  </div>
  <div class="main-content access-wrap">
    <div class="access-card">
      <h2>🔒 Beveiligde pagina</h2>
      <p class="text-muted mb-3">Voer het wachtwoord in om het scorebord te bekijken.</p>
      {% if error %}
        <div class="alert alert-danger py-2 small mb-3">{{ error }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <input type="password" name="password" class="form-control form-control-lg"
                 placeholder="Wachtwoord" autofocus autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary access-btn">Toegang</button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>
